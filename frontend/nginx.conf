# Sign-in, registration and first-run setup are limited per client address.
# Behind Cloudflare Tunnel every request arrives from the tunnel host, so the
# backend's per-account lockout remains the primary defence; this zone caps the
# overall guessing rate.
limit_req_zone $binary_remote_addr zone=cost_review_auth:10m rate=10r/m;
limit_req_status 429;

# Demo/Test is an optional Compose profile. Its API is resolved at request time
# through Docker's DNS, so the gateway starts and serves Production even when
# api-test is not running; Demo/Test requests then fail with 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 5g;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'" always;

    location ~ ^/api/production/v1/(auth/login|auth/register|setup)$ {
        limit_req zone=cost_review_auth burst=10 nodelay;
        rewrite ^/api/production/(.*)$ /api/$1 break;
        proxy_pass http://api-prod:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/test/v1/(auth/login|auth/register|setup)$ {
        limit_req zone=cost_review_auth burst=10 nodelay;
        set $api_test http://api-test:8000;
        rewrite ^/api/test/(.*)$ /api/$1 break;
        proxy_pass $api_test;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/production/ {
        proxy_request_buffering off;
        proxy_pass http://api-prod:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/test/ {
        proxy_request_buffering off;
        set $api_test http://api-test:8000;
        rewrite ^/api/test/(.*)$ /api/$1 break;
        proxy_pass $api_test;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
