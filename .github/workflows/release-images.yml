name: Release container images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            image: cost-review-api
          - name: frontend
            context: ./frontend
            image: cost-review-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Cost Review ${{ matrix.name }} image
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

  release:
    name: Publish deployment files
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fx "COST_REVIEW_VERSION=${version}" .env.example
          grep -Fqx "version = \"${version}\"" backend/pyproject.toml
          RELEASE_VERSION="$version" node -e 'if (require("./frontend/package.json").version !== process.env.RELEASE_VERSION) process.exit(1)'
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir release
          cp docker-compose.yml release/docker-compose.yml
          cp .env.example release/cost-review.env
          cp .env.example release/.env
          cd release
          zip cost-review-docker-compose.zip docker-compose.yml .env
          sha256sum docker-compose.yml cost-review.env cost-review-docker-compose.zip > SHA256SUMS
      - name: Create GitHub release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release/docker-compose.yml \
              release/cost-review.env \
              release/cost-review-docker-compose.zip \
              release/SHA256SUMS \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/docker-compose.yml \
              release/cost-review.env \
              release/cost-review-docker-compose.zip \
              release/SHA256SUMS \
              --generate-notes \
              --title "Cost Review $GITHUB_REF_NAME" \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
