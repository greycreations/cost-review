name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cost_review_ci
          POSTGRES_USER: cost_review_ci
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cost_review_ci -d cost_review_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENVIRONMENT: test
      APP_ENVIRONMENT_LABEL: Demo/Test CI
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: cost_review_ci
      DB_USER: cost_review_ci
      DB_PASSWORD: ci-database-password
      SESSION_COOKIE_NAME: cost_review_ci_session
      CSRF_COOKIE_NAME: cost_review_ci_csrf
      COOKIE_SECURE: false
      APP_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      APP_ALLOWED_ORIGINS: http://testserver
      APP_TRUSTED_PROXY_IPS: testclient,127.0.0.1
      ATTACHMENT_ROOT: /tmp/cost-review-ci/attachments
      BACKUP_ROOT: /tmp/cost-review-ci/backups
      BACKUP_ENCRYPTION_KEY: ci-test-backup-encryption-key-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose-isolation:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.dev.yaml
      POSTGRES_PROD_PASSWORD: ci-production-database-password
      POSTGRES_TEST_PASSWORD: ci-test-database-password
      COOKIE_SECURE: false
      APP_ALLOWED_ORIGINS: http://localhost:8080
      APP_ALLOWED_HOSTS: localhost,127.0.0.1
      BACKUP_PROD_ENCRYPTION_KEY: ci-production-backup-encryption-key-32-chars
      BACKUP_TEST_ENCRYPTION_KEY: ci-test-backup-encryption-key-32-characters
    steps:
      - uses: actions/checkout@v7
      - name: Verify two-file installer surface
        run: |
          test -f docker-compose.yml
          test -f .env.example
          test ! -e scripts/init-env.sh
          test "$(grep -c '^.*=$' .env.example)" = "6"
      - run: docker compose -f docker-compose.yml --env-file .env.example config --quiet
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait
      - run: python backend/tests/compose_isolation.py
      - run: python backend/tests/compose_backup_restore.py
      - name: Prove Test API cannot resolve or connect to Production database
        run: |
          if docker compose exec -T api-test python -c "import socket; socket.create_connection(('db-prod', 5432), 2)"; then
            echo "Test API unexpectedly reached the Production database" >&2
            exit 1
          fi
      - if: always()
        run: docker compose down
